name: Atualizar Preços ERSE

on:
  schedule:
    # 06:00 UTC = 07:00 WEST (verão) / 06:00 WET (inverno) — aproximação Europe/Lisbon
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          pip install --quiet playwright
          playwright install chromium --with-deps

      - name: Scrape preços ERSE
        id: scrape
        run: |
          python3 <<'PYEOF'
          import asyncio, json, re, os, sys, unicodedata
          from datetime import datetime, timezone
          from pathlib import Path
          from playwright.async_api import async_playwright

          PRECOS_FILE = Path("precos.json")
          URL = "https://www.erse.pt/consumidores/eletricidade/comparador-de-comercializadores/"
          PRICE_MIN = 0.08
          PRICE_MAX = 0.35

          # Chaves internas → variantes de nome esperadas na página ERSE
          MAPA = {
              "edp":       ["edp comercial", "edp sv", "edp"],
              "galp":      ["galp energia", "galp power", "galp"],
              "golden":    ["goldenergy", "golden energy", "golden"],
              "coop":      ["coopernico", "coopérnico", "cooperativa"],
              "plenitude": ["plenitude", "eni gas", "eni"],
              "iber":      ["iberdrola"],
              "repsol":    ["repsol"],
              "endesa":    ["endesa"],
          }

          def normalizar(texto):
              nfkd = unicodedata.normalize("NFKD", str(texto))
              return "".join(c for c in nfkd if not unicodedata.combining(c)).lower().strip()

          def corresponde(nome_pagina, variantes):
              n = normalizar(nome_pagina)
              return any(v in n or n in v for v in variantes)

          def extrair_preco(texto):
              texto = str(texto).replace(",", ".").strip()
              m = re.search(r"(\d+\.\d+)", texto)
              if not m:
                  return None
              valor = float(m.group(1))
              if valor > 1:          # cêntimos → euros (ex: 14.56 → 0.1456)
                  valor = valor / 100
              if PRICE_MIN <= valor <= PRICE_MAX:
                  return f"{valor:.4f}"
              return None

          def ler_precos_atuais():
              if PRECOS_FILE.exists():
                  try:
                      return json.loads(PRECOS_FILE.read_text(encoding="utf-8"))
                  except Exception:
                      pass
              return {}

          def percorrer_json(obj, candidatos):
              if isinstance(obj, dict):
                  nome = preco = None
                  for k, v in obj.items():
                      kl = k.lower()
                      if any(x in kl for x in ["nome", "name", "comerci", "operador", "empresa"]):
                          if isinstance(v, str):
                              nome = v
                      if any(x in kl for x in ["prec", "valor", "tarif", "kwh", "custo"]):
                          if isinstance(v, (int, float, str)):
                              preco = str(v)
                  if nome and preco:
                      candidatos.append((nome, preco))
                  for v in obj.values():
                      percorrer_json(v, candidatos)
              elif isinstance(obj, list):
                  for item in obj:
                      percorrer_json(item, candidatos)

          def extrair_de_json(dados, fonte="API"):
              precos = {}
              candidatos = []
              percorrer_json(dados, candidatos)
              for nome, preco_str in candidatos:
                  p = extrair_preco(preco_str)
                  if p:
                      for chave, variantes in MAPA.items():
                          if corresponde(nome, variantes) and chave not in precos:
                              precos[chave] = p
                              print(f"  [{fonte}] {chave}: {p} ({nome})")
              return precos

          def extrair_de_html(html):
              precos = {}
              texto = re.sub(r"<[^>]+>", " ", html)
              texto = re.sub(r"\s+", " ", texto)
              # Dividir em segmentos de ~200 chars para pesquisa localizada
              segmentos = [texto[i:i+300] for i in range(0, len(texto), 150)]
              for seg in segmentos:
                  for chave, variantes in MAPA.items():
                      if chave in precos:
                          continue
                      if any(v in normalizar(seg) for v in variantes):
                          m = re.search(
                              r"(\d[\d,\.]+)\s*(?:€/kWh|eur/kwh|€\s*/\s*kwh|ct/kwh|cêntimos)",
                              seg, re.IGNORECASE
                          )
                          if m:
                              p = extrair_preco(m.group(1))
                              if p:
                                  precos[chave] = p
                                  print(f"  [HTML] {chave}: {p}")

              # JSON embutido em <script> tags
              for bloco in re.findall(r"<script[^>]*>(.*?)</script>", html, re.DOTALL):
                  for match in re.finditer(r"(\{[^<]{30,}\})", bloco):
                      try:
                          obj = json.loads(match.group(1))
                          mais = extrair_de_json(obj, "SCRIPT")
                          for k, v in mais.items():
                              if k not in precos:
                                  precos[k] = v
                      except Exception:
                          pass
              return precos

          async def main():
              github_output = os.environ.get("GITHUB_OUTPUT", "/dev/null")
              precos_atuais = ler_precos_atuais()
              chaves_dados = list(MAPA.keys())
              precos_prev = {k: str(precos_atuais[k]) for k in chaves_dados if k in precos_atuais}
              print(f"Preços anteriores: {precos_prev}")

              encontrados = {}
              erro_msg = ""

              try:
                  print(f"\nA aceder: {URL}")
                  dados_api_capturados = {}

                  async with async_playwright() as pw:
                      browser = await pw.chromium.launch(args=["--no-sandbox", "--disable-dev-shm-usage"])
                      context = await browser.new_context(
                          locale="pt-PT",
                          user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
                      )
                      page = await context.new_page()

                      async def capturar(resp):
                          ct = resp.headers.get("content-type", "")
                          if "json" in ct and resp.status == 200:
                              ul = resp.url.lower()
                              if any(k in ul for k in ["prec", "tarif", "comerci", "ofert", "compar", "erse"]):
                                  try:
                                      dados_api_capturados[resp.url] = await resp.json()
                                      print(f"  API: {resp.url}")
                                  except Exception:
                                      pass

                      page.on("response", capturar)
                      try:
                          await page.goto(URL, wait_until="networkidle", timeout=90000)
                      except Exception as e:
                          print(f"  Aviso goto: {e}")
                      await page.wait_for_timeout(8000)
                      html = await page.content()
                      await browser.close()

                  # Tentar APIs capturadas primeiro
                  for dados in dados_api_capturados.values():
                      mais = extrair_de_json(dados, "API")
                      for k, v in mais.items():
                          if k not in encontrados:
                              encontrados[k] = v

                  # Fallback HTML
                  if len(encontrados) < 3:
                      mais_html = extrair_de_html(html)
                      for k, v in mais_html.items():
                          if k not in encontrados:
                              encontrados[k] = v

                  print(f"\nTotal encontrado: {len(encontrados)} comercializadoras: {list(encontrados.keys())}")

                  if not encontrados:
                      raise RuntimeError("Nenhum preço extraído — estrutura HTML pode ter mudado")

              except Exception as e:
                  erro_msg = str(e)
                  print(f"\nERRO: {erro_msg}", file=sys.stderr)
                  with open(github_output, "a") as f:
                      f.write("sucesso=false\n")
                      f.write(f"erro={erro_msg[:200]}\n")
                      f.write("alterado=false\n")
                      f.write("resumo=\n")
                  sys.exit(0)  # Job não falha — Telegram notifica o erro

              # Merge: novo se encontrado e válido, manter anterior caso contrário
              precos_finais = {}
              for chave in chaves_dados:
                  if chave in encontrados:
                      precos_finais[chave] = encontrados[chave]
                  elif chave in precos_prev:
                      precos_finais[chave] = precos_prev[chave]
                      print(f"  MANTIDO (não encontrado): {chave} = {precos_prev[chave]}")
                  else:
                      print(f"  AVISO: sem preço para {chave} e sem anterior")

              agora = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
              resultado = {**precos_finais, "ultima_atualizacao": agora, "fonte": "ERSE"}
              json_novo = json.dumps(resultado, ensure_ascii=False, indent=2)

              # Verificar se os preços mudaram (ignorar metadados)
              def so_precos(d):
                  return {k: v for k, v in d.items() if k not in ("ultima_atualizacao", "fonte")}

              alterado = True
              if PRECOS_FILE.exists():
                  try:
                      atual = json.loads(PRECOS_FILE.read_text(encoding="utf-8"))
                      if so_precos(atual) == so_precos(resultado):
                          alterado = False
                          print("\nPreços sem alteração — não haverá commit.")
                  except Exception:
                      pass

              PRECOS_FILE.write_text(json_novo + "\n", encoding="utf-8")
              print(f"\nprecos.json escrito:\n{json_novo}")

              resumo = " | ".join(f"{k}:{v}" for k, v in precos_finais.items())
              with open(github_output, "a") as f:
                  f.write("sucesso=true\n")
                  f.write(f"alterado={'true' if alterado else 'false'}\n")
                  f.write("erro=\n")
                  f.write(f"resumo={resumo}\n")

          asyncio.run(main())
          PYEOF

      - name: Commit e push (apenas se alterado)
        if: steps.scrape.outputs.sucesso == 'true' && steps.scrape.outputs.alterado == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add precos.json
          git commit -m "feat: GitHub Actions — preços ERSE actualizados automaticamente às 07:00"
          git push

      - name: Telegram — sucesso
        if: steps.scrape.outputs.sucesso == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESUMO: ${{ steps.scrape.outputs.resumo }}
          ALTERADO: ${{ steps.scrape.outputs.alterado }}
        run: |
          if [ "$ALTERADO" = "true" ]; then
            EMOJI="✅"; ESTADO="Preços actualizados e guardados"
          else
            EMOJI="ℹ️"; ESTADO="Preços sem alteração — sem commit"
          fi
          DATA=$(date -u '+%Y-%m-%d %H:%M UTC')
          LINHAS=$(echo "$RESUMO" | tr '|' '\n' | sed 's/ //g' | sed 's/:/: /g')
          MSG="$EMOJI ENERSIA — $ESTADO
          📅 $DATA

          $LINHAS"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null

      - name: Telegram — falha
        if: steps.scrape.outputs.sucesso == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ERRO: ${{ steps.scrape.outputs.erro }}
        run: |
          DATA=$(date -u '+%Y-%m-%d %H:%M UTC')
          MSG="❌ ENERSIA — Falha ao actualizar preços ERSE
          📅 $DATA

          Erro: $ERRO

          ⚠️ precos.json anterior mantido sem alterações."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null
