name: Atualizar Preços ERSE

on:
  schedule:
    # 06:00 UTC = 07:00 WEST (verão) / 06:00 WET (inverno) — aproximação Europe/Lisbon
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Atualizar preços via CSV oficial ERSE
        id: scrape
        run: |
          python3 <<'PYEOF'
          """
          Extrai preços de eletricidade do ZIP CSV oficial publicado pela ERSE em:
            simuladorprecos.erse.pt/config/Settings.json -> csvPath -> ZIP
          Dois ficheiros dentro do ZIP:
            CondComerciais.csv  — metadados das ofertas (segmento, tipo, URL)
            Precos_ELEGN.csv    — preços por oferta/potência/contagem
          """
          import csv, io, json, os, re, sys, unicodedata, urllib.request, zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          PRECOS_FILE = Path("precos.json")
          SETTINGS_URL = "https://simuladorprecos.erse.pt/config/Settings.json"
          PRICE_MIN, PRICE_MAX = 0.08, 0.35

          # Código COM -> chave interna ENERSIA
          # Verificado em 2026-05-23: EDPC=EDP(particulares), GALP=Galp, GOLD=Goldenergy,
          # COOP=Coopernico, ENIPLENITUDE=Plenitude/ENI, IBD=Iberdrola, REPSOL=Repsol, END=Endesa
          MAPA_COM = {
              "edp":       ["EDPC"],
              "galp":      ["GALP"],
              "golden":    ["GOLD"],
              "coop":      ["COOP"],
              "plenitude": ["ENIPLENITUDE"],
              "iber":      ["IBD"],
              "repsol":    ["REPSOL"],
              "endesa":    ["END"],
          }
          CHAVES = list(MAPA_COM.keys())

          # Potências domésticas por ordem de preferência (kVA)
          POTS_PREF = [6.9, 3.45, 4.6, 5.75, 10.35, 13.8]

          def fetch(url, timeout=30):
              url_enc = url.replace(" ", "%20")
              req = urllib.request.Request(
                  url_enc,
                  headers={"User-Agent": "ENERSIA-price-updater/2.0 (github-actions)"}
              )
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read()

          def ler_precos_anteriores():
              if PRECOS_FILE.exists():
                  try:
                      return json.loads(PRECOS_FILE.read_text(encoding="utf-8"))
                  except Exception:
                      pass
              return {}

          def validar_preco(val_str):
              """Converte string de preco (virgula ou ponto) para float validado. None se invalido."""
              try:
                  v = float(str(val_str).replace(",", ".").strip())
                  if v > 1:          # cêntimos → euros (14,56 -> 0.1456)
                      v /= 100
                  if PRICE_MIN <= v <= PRICE_MAX:
                      return v
              except Exception:
                  pass
              return None

          def extrair_precos(cond_raw, prec_raw):
              """
              Retorna dict {chave_enersia: preco_float} com o melhor preco por empresa.

              Estratégia:
                Fase 1: ofertas residenciais (Segmento != Ndom), eletricidade, preço FIXO (sem OMIE).
                Fase 2 (fallback): ofertas residenciais, qualquer tipo de preço.
                Fase 3 (último recurso): qualquer segmento, qualquer tipo de preço.
              Em cada fase: Contagem=1 (simples) > Contagem=2 (bi-horária), pot=6.9 > outras.
              Preço representativo:
                Contagem=1 -> TV (tarifa variável simples)
                Contagem=2 -> 0.30 * TV + 0.70 * TVV  (ponderação residencial típica)
              """

              def classificar_ofertas(segmento_ok, omie_ok):
                  """Retorna set de COD_Proposta que passam no filtro."""
                  validas = set()
                  reader = csv.DictReader(io.StringIO(cond_raw), delimiter=";")
                  for row in reader:
                      if row.get("Fornecimento", "").strip() != "ELE":
                          continue
                      seg = row.get("Segmento", "").strip()
                      if not segmento_ok and seg == "Ndom":
                          continue
                      txerse = row.get("TxTERSE", "").lower()
                      if not omie_ok and ("omie" in txerse or "mercado spot" in txerse):
                          continue
                      validas.add(row.get("COD_Proposta", "").strip())
                  return validas

              def calcular_precos(ofertas_validas):
                  """Dado um conjunto de COD_Proposta válidos, retorna melhor preço por chave."""
                  # Acumular (preco_representativo, pot, contagem) por COM
                  candidatos = {}  # com -> list of (preco, pot, contagem)

                  reader = csv.DictReader(io.StringIO(prec_raw), delimiter=";")
                  for row in reader:
                      com = row.get("COM", "").strip()
                      cod_prop = row.get("COD_Proposta", "").strip()
                      if cod_prop not in ofertas_validas:
                          continue
                      pot_v = validar_preco(row.get("Pot_Cont", "0"))
                      if pot_v is None:
                          continue
                      contagem = row.get("Contagem", "").strip()
                      tv = validar_preco(row.get("TV|TVFV|TVP", ""))
                      tvv = validar_preco(row.get("TVV|TVC", ""))

                      if contagem == "1" and tv is not None:
                          preco = tv
                      elif contagem == "2" and tv is not None and tvv is not None:
                          preco = 0.30 * tv + 0.70 * tvv
                      elif contagem == "2" and tv is not None:
                          preco = tv
                      elif tvv is not None:
                          preco = tvv
                      else:
                          continue

                      if not (PRICE_MIN <= preco <= PRICE_MAX):
                          continue

                      if com not in candidatos:
                          candidatos[com] = []
                      candidatos[com].append((preco, pot_v, contagem))

                  # Para cada chave ENERSIA, escolher melhor preço
                  resultado = {}
                  for chave, codigos in MAPA_COM.items():
                      melhor = None
                      for cod in codigos:
                          entradas = candidatos.get(cod, [])
                          if not entradas:
                              continue
                          # Ordenar: Contagem=1 primeiro, depois pot preferida, depois menor preço
                          def sort_key(e):
                              preco, pot, cont = e
                              cont_ord = 0 if cont == "1" else 1
                              pot_ord = POTS_PREF.index(pot) if pot in POTS_PREF else 99
                              return (cont_ord, pot_ord, preco)
                          entradas_sorted = sorted(entradas, key=sort_key)
                          preco_escolhido = entradas_sorted[0][0]
                          if melhor is None or preco_escolhido < melhor:
                              melhor = preco_escolhido
                      if melhor is not None:
                          resultado[chave] = melhor
                  return resultado

              # Percorrer 3 fases progressivamente mais permissivas.
              # Por fase, preencher apenas as chaves ainda em falta — as já encontradas
              # em fases anteriores (mais restritas) têm prioridade.
              resultado = {}
              for fase, (seg_ok, omie_ok) in enumerate([
                  (False, False),   # Fase 1: residencial + preço fixo
                  (False, True),    # Fase 2: residencial + qualquer preço (inclui OMIE)
                  (True,  True),    # Fase 3: qualquer segmento + qualquer preço
              ], start=1):
                  em_falta = [c for c in CHAVES if c not in resultado]
                  if not em_falta:
                      break
                  validas = classificar_ofertas(seg_ok, omie_ok)
                  print(f"  Fase {fase}: {len(validas)} ofertas válidas | em falta: {em_falta}")
                  mais = calcular_precos(validas)
                  for k, v in mais.items():
                      if k not in resultado:   # não sobrescrever resultado de fase mais restrita
                          resultado[k] = v
                  print(f"  Fase {fase}: encontrados agora: {list(mais.keys())} | total: {list(resultado.keys())}")

              return resultado

          def main():
              github_output = os.environ.get("GITHUB_OUTPUT", "/dev/null")
              precos_prev = ler_precos_anteriores()
              print(f"Preços anteriores: { {k: precos_prev.get(k) for k in CHAVES} }")

              try:
                  # 1. Obter URL do CSV mais recente
                  print(f"\nA obter Settings.json de {SETTINGS_URL}")
                  settings = json.loads(fetch(SETTINGS_URL))
                  csv_url = settings.get("csvPath", "")
                  if not csv_url:
                      raise RuntimeError("csvPath não encontrado no Settings.json")
                  print(f"CSV URL: {csv_url}")

                  # 2. Descarregar ZIP
                  print("A descarregar ZIP...")
                  zip_data = fetch(csv_url, timeout=60)
                  print(f"ZIP descarregado: {len(zip_data)} bytes")

                  # 3. Extrair CSVs — detecção dinâmica de paths dentro do ZIP
                  zf = zipfile.ZipFile(io.BytesIO(zip_data))
                  nomes = zf.namelist()
                  print(f"Ficheiros no ZIP: {nomes}")

                  def encontrar_csv(padrao):
                      """Encontra ficheiro no ZIP cujo nome (sem pasta) contém `padrao` (case-insensitive)."""
                      candidatos = [n for n in nomes
                                    if padrao.lower() in n.lower().split("/")[-1]
                                    and n.lower().endswith(".csv")]
                      print(f"  Padrão '{padrao}': candidatos={candidatos}")
                      if not candidatos:
                          raise RuntimeError(
                              f"Ficheiro com '{padrao}' não encontrado no ZIP. "
                              f"Ficheiros disponíveis: {nomes}"
                          )
                      escolhido = candidatos[0]
                      if len(candidatos) > 1:
                          print(f"  Múltiplos candidatos — a usar: {escolhido}")
                      else:
                          print(f"  A usar: {escolhido}")
                      return escolhido

                  cond_path = encontrar_csv("CondComerciais")
                  prec_path = encontrar_csv("Precos_ELEGN")
                  cond_raw = zf.read(cond_path).decode("utf-8-sig", errors="replace")
                  prec_raw = zf.read(prec_path).decode("utf-8-sig", errors="replace")
                  print(f"CSVs extraídos: {cond_path}={len(cond_raw)} chars, {prec_path}={len(prec_raw)} chars")

                  # 4. Extrair preços
                  print("\nA extrair preços...")
                  encontrados = extrair_precos(cond_raw, prec_raw)

              except Exception as e:
                  erro_msg = str(e)[:300]
                  print(f"\nERRO: {erro_msg}", file=sys.stderr)
                  with open(github_output, "a") as f:
                      f.write("sucesso=false\n")
                      f.write(f"erro={erro_msg}\n")
                      f.write("alterado=false\n")
                      f.write("resumo=\n")
                  sys.exit(0)

              # 5. Merge: usar novo se encontrado e válido, manter anterior se não
              precos_finais = {}
              for chave in CHAVES:
                  if chave in encontrados:
                      precos_finais[chave] = f"{encontrados[chave]:.4f}"
                  elif chave in precos_prev and str(precos_prev[chave]).replace(".", "").replace(",", "").isdigit():
                      precos_finais[chave] = str(precos_prev[chave])
                      print(f"  MANTIDO (sem dados novos): {chave} = {precos_finais[chave]}")
                  else:
                      print(f"  AVISO: sem preço para {chave}")

              if not precos_finais:
                  erro_msg = "Nenhum preço extraído e nenhum anterior disponível"
                  print(f"\nERRO: {erro_msg}", file=sys.stderr)
                  with open(github_output, "a") as f:
                      f.write("sucesso=false\n")
                      f.write(f"erro={erro_msg}\n")
                      f.write("alterado=false\n")
                      f.write("resumo=\n")
                  sys.exit(0)

              # Log dos preços encontrados
              print("\n--- Preços finais ---")
              for k, v in precos_finais.items():
                  origem = "NOVO" if k in encontrados else "MANTIDO"
                  print(f"  {k:<12}: {v}  [{origem}]")

              # 6. Ler estado anterior para comparação e cálculo de dias
              agora = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
              ultima_atualizacao_anterior = agora  # default: hoje
              dias_sem_alt = 0

              precos_anteriores_obj = {}
              if PRECOS_FILE.exists():
                  try:
                      precos_anteriores_obj = json.loads(PRECOS_FILE.read_text(encoding="utf-8"))
                      ua = precos_anteriores_obj.get("ultima_atualizacao") or precos_anteriores_obj.get("updatedAt")
                      if ua:
                          ultima_atualizacao_anterior = ua
                          try:
                              dt_ant = datetime.fromisoformat(ua.replace("Z", "+00:00"))
                              dt_now = datetime.now(timezone.utc)
                              dias_sem_alt = (dt_now - dt_ant).days
                          except Exception:
                              pass
                  except Exception:
                      pass

              # 7. Verificar se houve alteração real nos preços
              def so_precos(d):
                  campos_meta = {"ultima_atualizacao", "ultima_verificacao", "updatedAt",
                                 "updatedAtLisbon", "fonte", "source", "alterado",
                                 "dias_sem_alteracao"}
                  return {k: str(v) for k, v in d.items() if k not in campos_meta}

              alterado = True
              if precos_anteriores_obj:
                  if so_precos(precos_anteriores_obj) == so_precos({**precos_finais}):
                      alterado = False
                      print(f"\nPreços sem alteração — mantidos desde {ultima_atualizacao_anterior[:10]}.")

              # 8. Construir JSON de saída
              # ultima_atualizacao só muda quando os preços mudam
              # ultima_verificacao é sempre actualizado (registo diário do check)
              ultima_atualizacao_final = agora if alterado else ultima_atualizacao_anterior
              dias_final = 0 if alterado else dias_sem_alt

              resultado = {
                  **precos_finais,
                  "ultima_atualizacao": ultima_atualizacao_final,
                  "ultima_verificacao": agora,
                  "alterado": alterado,
                  "dias_sem_alteracao": dias_final,
                  "fonte": "ERSE",
              }
              json_novo = json.dumps(resultado, ensure_ascii=False, indent=2)

              PRECOS_FILE.write_text(json_novo + "\n", encoding="utf-8")
              print(f"\nprecos.json escrito:\n{json_novo}")

              resumo = " | ".join(f"{k}:{v}" for k, v in precos_finais.items())
              with open(github_output, "a") as f:
                  f.write("sucesso=true\n")
                  f.write(f"alterado={'true' if alterado else 'false'}\n")
                  f.write("erro=\n")
                  f.write(f"resumo={resumo}\n")
                  f.write(f"dias_sem_alt={dias_final}\n")
                  f.write(f"ultima_atualizacao={ultima_atualizacao_final[:10]}\n")

          main()
          PYEOF

      - name: Commit e push
        if: steps.scrape.outputs.sucesso == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add precos.json
          if [ "${{ steps.scrape.outputs.alterado }}" = "true" ]; then
            git commit -m "chore: actualizar precos.json — dados ERSE $(date -u '+%Y-%m-%d')"
          else
            git commit -m "chore: verificacao diaria ERSE — sem alteracao de precos $(date -u '+%Y-%m-%d')"
          fi
          git push

      - name: Telegram — sucesso
        if: steps.scrape.outputs.sucesso == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESUMO: ${{ steps.scrape.outputs.resumo }}
          ALTERADO: ${{ steps.scrape.outputs.alterado }}
          DIAS: ${{ steps.scrape.outputs.dias_sem_alt }}
          ULT_AT: ${{ steps.scrape.outputs.ultima_atualizacao }}
        run: |
          DATA=$(date -u '+%Y-%m-%d %H:%M UTC')
          LINHAS=$(echo "$RESUMO" | tr '|' '\n' | sed 's/^ //;s/ $//' | sed 's/:/: €\/kWh — /')

          if [ "$ALTERADO" = "true" ]; then
            # Preços mudaram — notificação positiva
            MSG="✅ ENERSIA — Preços actualizados
          📅 ${DATA}

          Comercializadoras actualizadas:
          ${LINHAS}

          Dados guardados em precos.json e disponíveis no site."

          elif [ "${DIAS}" -ge 6 ] 2>/dev/null; then
            # 6+ dias sem alteração — alerta possível problema
            MSG="🚨 ENERSIA — Verificar sistema de preços
          📅 ${DATA}

          ⚠️ Preços sem alteração há ${DIAS} dias (desde ${ULT_AT}).
          Isto pode ser normal (ERSE não actualizou) ou indicar um problema no scraper.

          Acção recomendada: verificar logs do GitHub Actions e simuladorprecos.erse.pt

          Preços actuais:
          ${LINHAS}"

          elif [ "${DIAS}" -ge 3 ] 2>/dev/null; then
            # 3–5 dias sem alteração — aviso subtil
            MSG="⚠️ ENERSIA — Preços estáveis (${DIAS} dias)
          📅 ${DATA}

          Os preços da ERSE não foram alterados desde ${ULT_AT}.
          Sistema a funcionar normalmente — próxima revisão ERSE prevista trimestralmente.

          Preços confirmados:
          ${LINHAS}"

          else
            # 0–2 dias sem alteração — normal
            MSG="ℹ️ ENERSIA — Verificação diária concluída
          📅 ${DATA}

          Sem alterações de preços (último update: ${ULT_AT}).
          Sistema a funcionar correctamente.

          Preços actuais:
          ${LINHAS}"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null

      - name: Telegram — falha
        if: steps.scrape.outputs.sucesso == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ERRO: ${{ steps.scrape.outputs.erro }}
        run: |
          DATA=$(date -u '+%Y-%m-%d %H:%M UTC')
          MSG="❌ ENERSIA — Falha ao actualizar preços ERSE
          📅 ${DATA}

          Erro: ${ERRO}

          ⚠️ precos.json anterior mantido sem alterações."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null
